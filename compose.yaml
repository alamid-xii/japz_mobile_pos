name: japz-reservations

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: japz_pos
      MYSQL_USER: japz
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run npm run docker:setup first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run docker:setup first}
      TZ: Asia/Manila
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql --host=127.0.0.1 --user=$$MYSQL_USER --database=$$MYSQL_DATABASE --execute='SELECT 1' --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  backend:
    image: japz-reservations-backend:local
    build:
      context: ./japz-backend
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: japz_pos
      DB_USER: japz
      DB_PASSWORD: ${MYSQL_PASSWORD:?Run npm run docker:setup first}
      JWT_SECRET: ${JWT_SECRET:?Run npm run docker:setup first}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Run npm run docker:setup first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run npm run docker:setup first}
      TRUST_PROXY: "1"
      TZ: Asia/Manila
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY:-}
      MAILJET_FROM_EMAIL: ${MAILJET_FROM_EMAIL:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: japz-reservations-frontend:local
    build:
      context: ./japz-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    volumes:
      - phpmyadmin_sessions:/sessions
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--output",
          "/dev/null",
          "http://127.0.0.1/",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  mysql_data:
    name: japz_reservations_mysql_data
  phpmyadmin_sessions:
    name: japz_reservations_phpmyadmin_sessions
