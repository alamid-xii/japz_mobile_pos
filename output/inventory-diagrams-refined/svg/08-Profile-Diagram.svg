<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020"><title>Profile Diagram</title><desc>JAPZInventoryProfile defines domain-specific stereotypes for inventory records, service components and stock operations. Each definition carries a tagged value and extends its corresponding UML metaclass.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#283238" text-anchor="start">08 Profile Diagram</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#6c7475" text-anchor="start">UML profile | inventory documentation stereotypes and tagged values</text><polyline points="42,116 1458,116" fill="none" stroke="#c9d0d7" stroke-width="1.2"/><path d="M55,191 V165 H819.5000000000001 V191 H1445 V900 H55 Z M55,191 H819.5000000000001" stroke="#87918e" stroke-width="1.2" fill="#fafbf9"/><text x="88" y="238.75" font-family="Arial" font-size="26" font-weight="bold" fill="#283238" text-anchor="start">«profile» JAPZInventoryProfile</text><rect x="112" y="303" width="590" height="150" rx="0" stroke="#87918e" stroke-width="1.2" fill="white"/><rect x="112" y="303" width="590" height="54" rx="0" stroke="#87918e" stroke-width="1.2" fill="#fafbf9"/><text x="134" y="338.625" font-family="Arial" font-size="23" font-weight="bold" fill="#283238" text-anchor="start">«stereotype» InventoryRecord</text><text x="136" y="392.25" font-family="Arial" font-size="22" font-weight="normal" fill="#283238" text-anchor="start">tableName: String</text><text x="136" y="431.125" font-family="Arial" font-size="19" font-weight="normal" fill="#6c7475" text-anchor="start">Example: StockBatch → inventory_batches</text><rect x="1070" y="316" width="310" height="122" rx="0" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="1225.0" y="371.25" font-family="Arial" font-size="23" font-weight="normal" fill="#283238" text-anchor="middle">«metaclass»</text><text x="1225.0" y="400.0" font-family="Arial" font-size="23" font-weight="normal" fill="#283238" text-anchor="middle">Class</text><polyline points="702,378 1070,378" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M1059.0,384.0 L1070,378 L1059.0,372.0 Z" fill="#596367" stroke="#596367" stroke-width="1.2"/><text x="881.0" y="349.25" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">extension</text><rect x="112" y="499" width="590" height="150" rx="0" stroke="#87918e" stroke-width="1.2" fill="white"/><rect x="112" y="499" width="590" height="54" rx="0" stroke="#87918e" stroke-width="1.2" fill="#fafbf9"/><text x="134" y="534.625" font-family="Arial" font-size="23" font-weight="bold" fill="#283238" text-anchor="start">«stereotype» InventoryService</text><text x="136" y="588.25" font-family="Arial" font-size="22" font-weight="normal" fill="#283238" text-anchor="start">sourceFile: String</text><text x="136" y="627.125" font-family="Arial" font-size="19" font-weight="normal" fill="#6c7475" text-anchor="start">Example: inventoryService.js</text><rect x="1070" y="512" width="310" height="122" rx="0" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="1225.0" y="567.25" font-family="Arial" font-size="23" font-weight="normal" fill="#283238" text-anchor="middle">«metaclass»</text><text x="1225.0" y="596.0" font-family="Arial" font-size="23" font-weight="normal" fill="#283238" text-anchor="middle">Component</text><polyline points="702,574 1070,574" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M1059.0,580.0 L1070,574 L1059.0,568.0 Z" fill="#596367" stroke="#596367" stroke-width="1.2"/><text x="881.0" y="545.25" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">extension</text><rect x="112" y="695" width="590" height="150" rx="0" stroke="#87918e" stroke-width="1.2" fill="white"/><rect x="112" y="695" width="590" height="54" rx="0" stroke="#87918e" stroke-width="1.2" fill="#fafbf9"/><text x="134" y="730.625" font-family="Arial" font-size="23" font-weight="bold" fill="#283238" text-anchor="start">«stereotype» StockOperation</text><text x="136" y="784.25" font-family="Arial" font-size="22" font-weight="normal" fill="#283238" text-anchor="start">transactional: Boolean</text><text x="136" y="823.125" font-family="Arial" font-size="19" font-weight="normal" fill="#6c7475" text-anchor="start">Example: receiveStock() → true</text><rect x="1070" y="708" width="310" height="122" rx="0" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="1225.0" y="763.25" font-family="Arial" font-size="23" font-weight="normal" fill="#283238" text-anchor="middle">«metaclass»</text><text x="1225.0" y="792.0" font-family="Arial" font-size="23" font-weight="normal" fill="#283238" text-anchor="middle">Operation</text><polyline points="702,770 1070,770" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M1059.0,776.0 L1070,770 L1059.0,764.0 Z" fill="#596367" stroke="#596367" stroke-width="1.2"/><text x="881.0" y="741.25" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">extension</text><text x="48" y="982.75" font-family="Arial" font-size="18" font-weight="normal" fill="#6c7475" text-anchor="start">Filled extension triangles point to UML metaclasses. Stereotypes and tags customize the documentation model; they do not add runtime functionality.</text></svg>