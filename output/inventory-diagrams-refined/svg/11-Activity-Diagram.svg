<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1520" viewBox="0 0 1600 1520"><title>Activity Diagram</title><desc>This activity models receiving access checks, request identity branches and the transaction that creates receipt records and stock changes. A new successful request commits; an identical retry returns its prior result; conflicting identities and write errors abort the attempt.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#283238" text-anchor="start">11 Activity Diagram</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#6c7475" text-anchor="start">UML activity | stock receiving, identity checks and atomic persistence</text><polyline points="42,116 1558,116" fill="none" stroke="#c9d0d7" stroke-width="1.2"/><ellipse cx="735.0" cy="163.0" rx="12.0" ry="12.0" stroke="#87918e" stroke-width="1.2" fill="#283238"/><rect x="500" y="203" width="470" height="66" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="735.0" y="243.5" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Submit delivery + requestId</text><polyline points="735,175 735,203" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M729.0,192.0 L735,203 L741.0,192.0" fill="none" stroke="#596367" stroke-width="1.2"/><rect x="500" y="303" width="470" height="66" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="735.0" y="343.5" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Check actor access and requestId</text><polyline points="735,269 735,303" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M729.0,292.0 L735,303 L741.0,292.0" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M 735.0,407 L 815,449.5 L 735.0,492 L 655,449.5 Z" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="735.0" y="457.0" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Valid?</text><polyline points="735,369 735,407" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M729.0,396.0 L735,407 L741.0,396.0" fill="none" stroke="#596367" stroke-width="1.2"/><rect x="1110" y="414" width="360" height="66" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="1290.0" y="454.5" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Return 401 / 403 / invalid ID</text><polyline points="815,449 1110,449" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M1099.0,455.0 L1110,449 L1099.0,443.0" fill="none" stroke="#596367" stroke-width="1.2"/><text x="950.0" y="433.25" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">[no]</text><ellipse cx="1290.0" cy="532.0" rx="12.0" ry="12.0" stroke="#87918e" stroke-width="1.2" fill="white"/><ellipse cx="1290.0" cy="532.0" rx="7.0" ry="7.0" stroke="#87918e" stroke-width="1.2" fill="#283238"/><polyline points="1290,480 1290,520" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M1284.0,509.0 L1290,520 L1296.0,509.0" fill="none" stroke="#596367" stroke-width="1.2"/><rect x="500" y="535" width="470" height="66" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="735.0" y="575.5" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Begin transaction; find requestId</text><polyline points="735,492 735,535" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M729.0,524.0 L735,535 L741.0,524.0" fill="none" stroke="#596367" stroke-width="1.2"/><text x="806.0" y="515.25" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">[yes]</text><path d="M 735.0,643 L 835,695.5 L 735.0,748 L 635,695.5 Z" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="735.0" y="690.5" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Request</text><text x="735.0" y="715.5" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">identity?</text><polyline points="735,601 735,643" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M729.0,632.0 L735,643 L741.0,632.0" fill="none" stroke="#596367" stroke-width="1.2"/><rect x="1090" y="660" width="390" height="85" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="1285.0" y="697.25" font-family="Arial" font-size="21" font-weight="normal" fill="#283238" text-anchor="middle">Return saved result;</text><text x="1285.0" y="723.5" font-family="Arial" font-size="21" font-weight="normal" fill="#283238" text-anchor="middle">commit read; refresh stock</text><polyline points="835,695 1090,695" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M1079.0,701.0 L1090,695 L1079.0,689.0" fill="none" stroke="#596367" stroke-width="1.2"/><text x="957.0" y="667.25" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">[identical]</text><ellipse cx="1285.0" cy="807.0" rx="12.0" ry="12.0" stroke="#87918e" stroke-width="1.2" fill="white"/><ellipse cx="1285.0" cy="807.0" rx="7.0" ry="7.0" stroke="#87918e" stroke-width="1.2" fill="#283238"/><polyline points="1285,745 1285,795" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M1279.0,784.0 L1285,795 L1291.0,784.0" fill="none" stroke="#596367" stroke-width="1.2"/><rect x="65" y="662" width="330" height="80" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="230.0" y="709.875" font-family="Arial" font-size="21" font-weight="normal" fill="#283238" text-anchor="middle">Roll back; return 409 conflict</text><polyline points="635,695 395,695" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M406.0,689.0 L395,695 L406.0,701.0" fill="none" stroke="#596367" stroke-width="1.2"/><text x="514.0" y="654.5" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">[actor / kind / payload</text><text x="514.0" y="677.0" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">conflict]</text><ellipse cx="230.0" cy="807.0" rx="12.0" ry="12.0" stroke="#87918e" stroke-width="1.2" fill="white"/><ellipse cx="230.0" cy="807.0" rx="7.0" ry="7.0" stroke="#87918e" stroke-width="1.2" fill="#283238"/><polyline points="230,742 230,795" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M224.0,784.0 L230,795 L236.0,784.0" fill="none" stroke="#596367" stroke-width="1.2"/><rect x="500" y="813" width="470" height="66" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="735.0" y="853.5" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Create operation; lock stock items</text><polyline points="735,748 735,813" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M729.0,802.0 L735,813 L741.0,802.0" fill="none" stroke="#596367" stroke-width="1.2"/><text x="806.0" y="775.25" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">[new]</text><rect x="500" y="920" width="470" height="66" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="735.0" y="960.5" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Validate supplier/date; create receipt</text><polyline points="735,879 735,920" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M729.0,909.0 L735,920 L741.0,909.0" fill="none" stroke="#596367" stroke-width="1.2"/><rect x="500" y="1027" width="470" height="66" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="735.0" y="1055.0" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Each line: validate / convert; batch;</text><text x="735.0" y="1080.0" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">balances; movement; receipt line</text><polyline points="735,986 735,1027" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M729.0,1016.0 L735,1027 L741.0,1016.0" fill="none" stroke="#596367" stroke-width="1.2"/><rect x="500" y="1134" width="470" height="66" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="735.0" y="1174.5" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Load receipt; save result; commit</text><polyline points="735,1093 735,1134" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M729.0,1123.0 L735,1134 L741.0,1123.0" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M 735.0,1244 L 820,1286.5 L 735.0,1329 L 650,1286.5 Z" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="735.0" y="1281.75" font-family="Arial" font-size="19" font-weight="normal" fill="#283238" text-anchor="middle">Write</text><text x="735.0" y="1305.5" font-family="Arial" font-size="19" font-weight="normal" fill="#283238" text-anchor="middle">outcome?</text><polyline points="735,1200 735,1244" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M729.0,1233.0 L735,1244 L741.0,1233.0" fill="none" stroke="#596367" stroke-width="1.2"/><rect x="1070" y="1255" width="410" height="70" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="1275.0" y="1297.875" font-family="Arial" font-size="21" font-weight="normal" fill="#283238" text-anchor="middle">Return receipt; refresh stock</text><polyline points="820,1286 1070,1286" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M1059.0,1292.0 L1070,1286 L1059.0,1280.0" fill="none" stroke="#596367" stroke-width="1.2"/><text x="951.5" y="1263.25" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">[success]</text><ellipse cx="1275.0" cy="1390.0" rx="12.0" ry="12.0" stroke="#87918e" stroke-width="1.2" fill="white"/><ellipse cx="1275.0" cy="1390.0" rx="7.0" ry="7.0" stroke="#87918e" stroke-width="1.2" fill="#283238"/><polyline points="1275,1325 1275,1378" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M1269.0,1367.0 L1275,1378 L1281.0,1367.0" fill="none" stroke="#596367" stroke-width="1.2"/><rect x="65" y="1255" width="350" height="70" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="240.0" y="1297.875" font-family="Arial" font-size="21" font-weight="normal" fill="#283238" text-anchor="middle">Roll back; show operation error</text><polyline points="650,1286 415,1286" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M426.0,1280.0 L415,1286 L426.0,1292.0" fill="none" stroke="#596367" stroke-width="1.2"/><text x="525.5" y="1263.25" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">[exception]</text><ellipse cx="240.0" cy="1390.0" rx="12.0" ry="12.0" stroke="#87918e" stroke-width="1.2" fill="white"/><ellipse cx="240.0" cy="1390.0" rx="7.0" ry="7.0" stroke="#87918e" stroke-width="1.2" fill="#283238"/><polyline points="240,1325 240,1378" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M234.0,1367.0 L240,1378 L246.0,1367.0" fill="none" stroke="#596367" stroke-width="1.2"/><text x="48" y="1482.75" font-family="Arial" font-size="18" font-weight="normal" fill="#6c7475" text-anchor="start">The write outcome summarizes exceptions from any transactional action; an exception stops subsequent writes and rolls everything back.</text></svg>