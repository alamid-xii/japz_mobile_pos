<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><title>State Machine Diagram</title><desc>StockCount records begin as pending when review is required, or applied when the actor and policy permit immediate adjustment. Admin approval applies only if the item version still matches and counted stock protects reservations; otherwise the record becomes stale. Rejection leaves balances unchanged.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#283238" text-anchor="start">13 State Machine Diagram</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#6c7475" text-anchor="start">UML state machine | persisted StockCount status and Admin review</text><polyline points="42,116 1558,116" fill="none" stroke="#c9d0d7" stroke-width="1.2"/><ellipse cx="125.0" cy="285.0" rx="12.0" ry="12.0" stroke="#87918e" stroke-width="1.2" fill="#283238"/><path d="M 375.0,230 L 445,285.0 L 375.0,340 L 305,285.0 Z" stroke="#87918e" stroke-width="1.2" fill="white"/><polyline points="137,285 305,285" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M294.0,291.0 L305,285 L294.0,279.0" fill="none" stroke="#596367" stroke-width="1.2"/><text x="213.5" y="257.25" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">valid count</text><rect x="620" y="220" width="330" height="130" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="785.0" y="279.0" font-family="Arial" font-size="24" font-weight="normal" fill="#283238" text-anchor="middle">pending</text><text x="785.0" y="309.0" font-family="Arial" font-size="24" font-weight="normal" fill="#283238" text-anchor="middle">Balance unchanged</text><polyline points="445,285 620,285" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M609.0,291.0 L620,285 L609.0,279.0" fill="none" stroke="#596367" stroke-width="1.2"/><text x="528.5" y="253.25" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">[review required]</text><rect x="1170" y="565" width="350" height="130" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="1345.0" y="624.0" font-family="Arial" font-size="24" font-weight="normal" fill="#283238" text-anchor="middle">applied</text><text x="1345.0" y="654.0" font-family="Arial" font-size="24" font-weight="normal" fill="#283238" text-anchor="middle">Count movement saved</text><polyline points="375,230 375,165 1540,165 1540,630 1520,630" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M1531.0,624.0 L1520,630 L1531.0,636.0" fill="none" stroke="#596367" stroke-width="1.2"/><text x="1262.5" y="203.25" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">[no review required] / apply</text><path d="M 785.0,475 L 865,530.0 L 785.0,585 L 705,530.0 Z" stroke="#87918e" stroke-width="1.2" fill="white"/><polyline points="785,350 785,475" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M779.0,464.0 L785,475 L791.0,464.0" fill="none" stroke="#596367" stroke-width="1.2"/><text x="912.5" y="413.25" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">Admin approves</text><polyline points="865,530 1080,530 1080,585 1170,585" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M1159.0,591.0 L1170,585 L1159.0,579.0" fill="none" stroke="#596367" stroke-width="1.2"/><text x="1228.0" y="459.0" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">[version matches and count ≥ reserved]</text><text x="1228.0" y="481.5" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">/ apply count movement</text><rect x="620" y="855" width="330" height="130" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="785.0" y="914.0" font-family="Arial" font-size="24" font-weight="normal" fill="#283238" text-anchor="middle">stale</text><text x="785.0" y="944.0" font-family="Arial" font-size="24" font-weight="normal" fill="#283238" text-anchor="middle">New count required</text><polyline points="785,585 785,855" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M779.0,844.0 L785,855 L791.0,844.0" fill="none" stroke="#596367" stroke-width="1.2"/><text x="1109.5" y="768.25" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">[version changed or count &lt; reserved]</text><rect x="60" y="855" width="350" height="130" rx="12" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="235.0" y="914.0" font-family="Arial" font-size="24" font-weight="normal" fill="#283238" text-anchor="middle">rejected</text><text x="235.0" y="944.0" font-family="Arial" font-size="24" font-weight="normal" fill="#283238" text-anchor="middle">Balance unchanged</text><polyline points="620,320 510,320 510,825 235,825 235,855" fill="none" stroke="#596367" stroke-width="1.2"/><path d="M229.0,844.0 L235,855 L241.0,844.0" fill="none" stroke="#596367" stroke-width="1.2"/><text x="245.0" y="794.25" font-family="Arial" font-size="18" font-weight="normal" fill="#283238" text-anchor="middle">Admin rejects</text><text x="48" y="1092.75" font-family="Arial" font-size="18" font-weight="normal" fill="#6c7475" text-anchor="start">Initial choice is before creation. applied, rejected and stale are terminal record statuses; recounting creates a new StockCount.</text></svg>