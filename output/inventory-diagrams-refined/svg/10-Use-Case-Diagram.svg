<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1250" viewBox="0 0 1700 1250"><title>Use Case Diagram</title><desc>Inventory Staff and Admin share the inventory operating goals shown on the left; the Admin actor also performs count review, reversals and policy control. Cashier and Kitchen appear at inventory read boundaries, and Kitchen can submit and view its own waste reports.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#283238" text-anchor="start">10 Use Case Diagram</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#6c7475" text-anchor="start">UML use cases | inventory goals and implemented role permissions</text><polyline points="42,116 1658,116" fill="none" stroke="#c9d0d7" stroke-width="1.2"/><rect x="315" y="155" width="1120" height="965" rx="0" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="875.0" y="205.375" font-family="Arial" font-size="25" font-weight="bold" fill="#283238" text-anchor="middle">Inventory Management</text><ellipse cx="130.0" cy="527.0" rx="17.0" ry="17.0" stroke="#87918e" stroke-width="1.2" fill="white"/><polyline points="130,544 130,604" fill="none" stroke="#596367" stroke-width="1.2"/><polyline points="90,563 170,563" fill="none" stroke="#596367" stroke-width="1.2"/><polyline points="130,604 97,644" fill="none" stroke="#596367" stroke-width="1.2"/><polyline points="130,604 163,644" fill="none" stroke="#596367" stroke-width="1.2"/><text x="130.5" y="673.0" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Inventory Operator</text><text x="130.5" y="698.0" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Inventory / Admin</text><ellipse cx="730.0" cy="282.5" rx="285.0" ry="37.5" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="730.0" y="290.75" font-family="Arial" font-size="22" font-weight="normal" fill="#283238" text-anchor="middle">View stock and availability</text><polyline points="170,563 445,282.5" fill="none" stroke="#596367" stroke-width="1.2"/><ellipse cx="730.0" cy="398.5" rx="285.0" ry="37.5" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="730.0" y="406.75" font-family="Arial" font-size="22" font-weight="normal" fill="#283238" text-anchor="middle">Maintain supplies and suppliers</text><polyline points="170,563 445,398.5" fill="none" stroke="#596367" stroke-width="1.2"/><ellipse cx="730.0" cy="514.5" rx="285.0" ry="37.5" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="730.0" y="522.75" font-family="Arial" font-size="22" font-weight="normal" fill="#283238" text-anchor="middle">Receive supplies / prepared stock</text><polyline points="170,563 445,514.5" fill="none" stroke="#596367" stroke-width="1.2"/><ellipse cx="730.0" cy="630.5" rx="285.0" ry="37.5" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="730.0" y="638.75" font-family="Arial" font-size="22" font-weight="normal" fill="#283238" text-anchor="middle">Manage recipes and batches</text><polyline points="170,563 445,630.5" fill="none" stroke="#596367" stroke-width="1.2"/><ellipse cx="730.0" cy="746.5" rx="285.0" ry="37.5" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="730.0" y="754.75" font-family="Arial" font-size="22" font-weight="normal" fill="#283238" text-anchor="middle">Record counts, waste and returns</text><polyline points="170,563 445,746.5" fill="none" stroke="#596367" stroke-width="1.2"/><ellipse cx="730.0" cy="862.5" rx="285.0" ry="37.5" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="730.0" y="870.75" font-family="Arial" font-size="22" font-weight="normal" fill="#283238" text-anchor="middle">Review waste reports</text><polyline points="170,563 445,862.5" fill="none" stroke="#596367" stroke-width="1.2"/><ellipse cx="730.0" cy="978.5" rx="285.0" ry="37.5" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="730.0" y="986.75" font-family="Arial" font-size="22" font-weight="normal" fill="#283238" text-anchor="middle">View history, reports and settings</text><polyline points="170,563 445,978.5" fill="none" stroke="#596367" stroke-width="1.2"/><ellipse cx="1525.0" cy="512.0" rx="17.0" ry="17.0" stroke="#87918e" stroke-width="1.2" fill="white"/><polyline points="1525,529 1525,589" fill="none" stroke="#596367" stroke-width="1.2"/><polyline points="1485,548 1565,548" fill="none" stroke="#596367" stroke-width="1.2"/><polyline points="1525,589 1492,629" fill="none" stroke="#596367" stroke-width="1.2"/><polyline points="1525,589 1558,629" fill="none" stroke="#596367" stroke-width="1.2"/><text x="1525.5" y="658.0" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Admin</text><text x="1525.5" y="683.0" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">role: admin</text><ellipse cx="1242.5" cy="480.0" rx="152.5" ry="45.0" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="1242.5" y="487.5" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Approve / reject counts</text><polyline points="1485,548 1395,480" fill="none" stroke="#596367" stroke-width="1.2"/><ellipse cx="1242.5" cy="665.0" rx="152.5" ry="45.0" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="1242.5" y="672.5" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Reverse stock movements</text><polyline points="1485,548 1395,665" fill="none" stroke="#596367" stroke-width="1.2"/><ellipse cx="1242.5" cy="850.0" rx="152.5" ry="45.0" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="1242.5" y="845.0" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Set approval / adjustment</text><text x="1242.5" y="870.0" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">policy</text><polyline points="1485,548 1395,850" fill="none" stroke="#596367" stroke-width="1.2"/><ellipse cx="130.0" cy="193.0" rx="17.0" ry="17.0" stroke="#87918e" stroke-width="1.2" fill="white"/><polyline points="130,210 130,270" fill="none" stroke="#596367" stroke-width="1.2"/><polyline points="90,229 170,229" fill="none" stroke="#596367" stroke-width="1.2"/><polyline points="130,270 97,310" fill="none" stroke="#596367" stroke-width="1.2"/><polyline points="130,270 163,310" fill="none" stroke="#596367" stroke-width="1.2"/><text x="130.5" y="339.0" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Cashier</text><text x="130.5" y="364.0" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">role: cashier</text><polyline points="170,229 245,229 245,282 445,282" fill="none" stroke="#596367" stroke-width="1.2"/><ellipse cx="1525.0" cy="999.0" rx="17.0" ry="17.0" stroke="#87918e" stroke-width="1.2" fill="white"/><polyline points="1525,1016 1525,1076" fill="none" stroke="#596367" stroke-width="1.2"/><polyline points="1485,1035 1565,1035" fill="none" stroke="#596367" stroke-width="1.2"/><polyline points="1525,1076 1492,1116" fill="none" stroke="#596367" stroke-width="1.2"/><polyline points="1525,1076 1558,1116" fill="none" stroke="#596367" stroke-width="1.2"/><text x="1525.5" y="1145.0" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Kitchen Staff</text><text x="1525.5" y="1170.0" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">role: kitchen</text><ellipse cx="1242.5" cy="1034.0" rx="152.5" ry="45.0" stroke="#87918e" stroke-width="1.2" fill="white"/><text x="1242.5" y="1029.0" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">Submit / view own</text><text x="1242.5" y="1054.0" font-family="Arial" font-size="20" font-weight="normal" fill="#283238" text-anchor="middle">waste reports</text><polyline points="1485,1035 1395,1034" fill="none" stroke="#596367" stroke-width="1.2"/><polyline points="1565,1035 1650,1035 1650,282 1015,282" fill="none" stroke="#596367" stroke-width="1.2"/><text x="48" y="1212.75" font-family="Arial" font-size="18" font-weight="normal" fill="#6c7475" text-anchor="start">Inventory Operator groups the shared capabilities of two existing roles. Admin has additional goals; Kitchen/Cashier have limited inventory API access.</text></svg>