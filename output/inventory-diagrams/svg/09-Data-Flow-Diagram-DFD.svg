<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050"><title>Data Flow Diagram (DFD)</title><desc>This level 1 DFD follows stock receiving data from an authorized actor through authentication, receipt processing and presentation. It includes user records, duplicate-request records and the stock persistence data store.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#17212b" text-anchor="start">09 Data Flow Diagram (DFD)</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#53616e" text-anchor="start">Level 1 DFD | stock receiving data and persistence; inventory-only scenario</text><polyline points="42,116 1458,116" fill="none" stroke="#c9d0d7" stroke-width="1.7"/><rect x="60" y="190" width="270" height="115" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="195.0" y="241.5" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">Inventory Staff</text><text x="195.0" y="271.5" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">or Admin</text><rect x="580" y="190" width="365" height="115" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="762.5" y="241.5" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">1.0 Authenticate</text><text x="762.5" y="271.5" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">Inventory Request</text><path d="M1425,190 H1155 V305 H1425 M1193,190 V305" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1309.0" y="256.125" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">D1 Users</text><polyline points="330,236 580,236" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M569.0,242.0 L580,236 L569.0,230.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="453.5" y="213.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">JWT + delivery data</text><polyline points="945,230 1155,230" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M1144.0,236.0 L1155,230 L1144.0,224.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="1050.0" y="215.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">user ID</text><polyline points="1155,276 945,276" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M956.0,270.0 L945,276 L956.0,282.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="1057.5" y="315.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">approved user + role</text><rect x="580" y="439" width="365" height="140" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="762.5" y="503.0" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">2.0 Validate and</text><text x="762.5" y="533.0" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">Record Stock Receipt</text><polyline points="760,305 760,439" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M754.0,428.0 L760,439 L766.0,428.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="900.0" y="377.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">authorized request</text><path d="M400,440 H60 V580 H400 M98,440 V580" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="249.0" y="491.625" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">D2 Inventory operations</text><text x="249.0" y="517.875" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">requestId + fingerprint</text><text x="249.0" y="544.125" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">+ saved result</text><polyline points="580,487 400,487" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M411.0,481.0 L400,487 L411.0,493.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="484.0" y="468.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">operation + result</text><polyline points="400,545 580,545" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M569.0,551.0 L580,545 L569.0,539.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="485.5" y="595.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">previous result</text><path d="M1445,440 H1155 V580 H1445 M1193,440 V580" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1319.0" y="478.5" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">D3 Stock records</text><text x="1319.0" y="504.75" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">items, batches,</text><text x="1319.0" y="531.0" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">receipts,</text><text x="1319.0" y="557.25" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">lines and movements</text><polyline points="1155,478 945,478" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M956.0,472.0 L945,478 L956.0,484.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="1048.5" y="460.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">items / supplier data</text><polyline points="945,545 1155,545" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M1144.0,551.0 L1155,545 L1144.0,539.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="1049.0" y="602.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">receipt + stock updates</text><rect x="580" y="762" width="365" height="115" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="762.5" y="813.5" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">3.0 Present Receipt</text><text x="762.5" y="843.5" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">and Stock Balances</text><polyline points="760,579 760,762" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M754.0,751.0 L760,762 L766.0,751.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="903.0" y="676.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">result / validation error</text><polyline points="1295,580 1295,817 945,817" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M956.0,811.0 L945,817 L956.0,823.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="1137.5" y="790.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">receipt / balances</text><polyline points="580,817 25,817 25,350 195,350 195,305" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M201.0,316.0 L195,305 L189.0,316.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="297.0" y="738.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">receipt / balances / errors</text><text x="48" y="1012.75" font-family="Arial" font-size="18" font-weight="normal" fill="#53616e" text-anchor="start">Gane-Sarson notation: rectangles = external entity; rounded numbered boxes = processes; divided open-store style = data stores.</text></svg>