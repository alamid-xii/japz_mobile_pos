<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950"><title>Object Diagram</title><desc>This object diagram instantiates the receiving classes after one example receipt. Underlined instance names, attribute slots and solid links show a consistent snapshot of supplier, item, batch, receipt, line and movement objects.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#17212b" text-anchor="start">05 Object Diagram</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#53616e" text-anchor="start">UML object snapshot | illustrative result after a successful stock receipt</text><polyline points="42,116 1458,116" fill="none" stroke="#c9d0d7" stroke-width="1.7"/><rect x="55" y="170" width="350" height="160" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="230.0" y="208.875" font-family="Arial" font-size="21" font-weight="bold" fill="#17212b" text-anchor="middle" text-decoration="underline">supplier1 : Supplier</text><line x1="130.5" y1="211.875" x2="329.5" y2="211.875" stroke="#17212b" stroke-width="1"/><polyline points="55,228 405,228" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="76" y="259.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">id = 1</text><text x="76" y="284.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">name = &quot;Example supplier&quot;</text><text x="76" y="309.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">active = true</text><rect x="565" y="170" width="400" height="235" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="765.0" y="208.875" font-family="Arial" font-size="21" font-weight="bold" fill="#17212b" text-anchor="middle" text-decoration="underline">item7 : StockItem</text><line x1="676.5" y1="211.875" x2="853.5" y2="211.875" stroke="#17212b" stroke-width="1"/><polyline points="565,228 965,228" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="586" y="259.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">id = 7; supplierId = 1</text><text x="586" y="284.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">name = &quot;Example ingredient&quot;</text><text x="586" y="309.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">unit = &quot;g&quot;; purchaseUnit = &quot;kg&quot;</text><text x="586" y="334.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">unitsPerPurchase = 1000</text><text x="586" y="359.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">onHand = 2000; reserved = 0</text><text x="586" y="384.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">version = 1</text><rect x="1110" y="170" width="335" height="235" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1277.5" y="208.875" font-family="Arial" font-size="21" font-weight="bold" fill="#17212b" text-anchor="middle" text-decoration="underline">batch21 : StockBatch</text><line x1="1169.0" y1="211.875" x2="138