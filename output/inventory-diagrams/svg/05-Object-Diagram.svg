t">receivedAt = illustrative time</text><rect x="565" y="555" width="400" height="235" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="765.0" y="593.875" font-family="Arial" font-size="21" font-weight="bold" fill="#17212b" text-anchor="middle" text-decoration="underline">line11 : StockReceiptLine</text><line x1="635.5078125" y1="596.875" x2="894.4921875" y2="596.875" stroke="#17212b" stroke-width="1"/><polyline points="565,613 965,613" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="586" y="644.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">id = 11; receiptId = 10</text><text x="586" y="669.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">stockItemId = 7; batchId = 21</text><text x="586" y="694.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">purchaseQuantity = 2</text><text x="586" y="719.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">purchaseUnit = &quot;kg&quot;</text><text x="586" y="744.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">conversion = 1000; quantity = 2000</text><text x="586" y="769.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">unitCost = 0.05</text><rect x="1110" y="555" width="335" height="235" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1277.5" y="593.875" font-family="Arial" font-size="21" font-weight="bold" fill="#17212b" text-anchor="middle" text-decoration="underline">move12 : StockMovement</text><line x1="1146.0" y1="596.875" x2="1409.0" y2="596.875" stroke="#17212b" stroke-width="1"/><polyline points="1110,613 1445,613" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="1131" y="644.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">id = 12; stockItemId = 7</text><text x="1131" y="669.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">batchId = 21; receiptId = 10</text><text x="1131" y="694.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">action = &quot;receive&quot;</text><text x="1131" y="719.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">onHandDelta = 2000</text><text x="1131" y="744.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">onHandBefore = 0</text><text x="1131" y="769.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">onHandAfter = 2000</text><polyline points="405,252 565,252" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="965,282 1110,282" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="230,330 230,555" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="405,660 565,660" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="730,405 730,555" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="965,650 1020,650 1020,454 1200,454 1200,405" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="1290,405 1290,555" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="48" y="912.75" font-family="Arial" font-size="18" font-weight="normal" fill="#53616e" text-anchor="start">EXAMPLE ONLY: no live database values. 2 kg × 1000 g/kg = 2000 g; 50 per kg ÷ 1000 = 0.05 per g.</text></svg>