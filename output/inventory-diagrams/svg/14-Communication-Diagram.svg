<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050"><title>Communication Diagram</title><desc>This communication diagram uses the same receiving scenario as the sequence diagram, emphasizing the network of collaborating objects. Hierarchical message numbers identify the request, service call, transactional operations and replies.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#17212b" text-anchor="start">14 Communication Diagram</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#53616e" text-anchor="start">UML communication | numbered message network for stock receiving</text><polyline points="42,116 1458,116" fill="none" stroke="#c9d0d7" stroke-width="1.7"/><rect x="75" y="220" width="330" height="135" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="240.0" y="296.875" font-family="Arial" font-size="25" font-weight="normal" fill="#17212b" text-anchor="middle">: InventoryStaff</text><rect x="585" y="220" width="340" height="135" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="755.0" y="296.5" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">: ReceivingUI / Axios</text><rect x="1090" y="220" width="330" height="135" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1255.0" y="296.875" font-family="Arial" font-size="25" font-weight="normal" fill="#17212b" text-anchor="middle">: inventoryRouter</text><rect x="1090" y="685" width="330" height="155" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1255.0" y="771.5" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">: inventoryService</text><rect x="570" y="685" width="355" height="155" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="747.5" y="771.5" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">: Sequelize / MySQL</text><polyline points="405,285 585,285" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="925,285 1090,285" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="1255,355 1255,685" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="1090,760 925,760" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="425,267 565,267" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M554.0,273.0 L565,267 L554.0,261.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="492.5" y="240.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">1: submit delivery</text><polyline points="945,267 1070,267" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M1059.0,273.0 L1070,267 L1059.0,261.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="1007.5" y="215.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">1.1: POST /receive</text><polyline points="1236,390 1236,650" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M1230.0,639.0 L1236,650 L1242.0,639.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="1080.0" y="441.5" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-