nt-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">communication paths.</text><text x="250.0" y="795.75" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">Dashed arrows show replies.</text><text x="48" y="1012.75" font-family="Arial" font-size="18" font-weight="normal" fill="#53616e" text-anchor="start">Communication topology is emphasized; message sequence is carried by numbering, not vertical lifelines.</text></svg>