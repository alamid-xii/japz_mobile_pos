<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950"><title>Composite Structure Diagram</title><desc>The composite structure diagram opens the inventory router boundary to show its collaborating middleware, route handler, stock service and Sequelize model parts. Ports represent the HTTP request boundary and SQL persistence boundary.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#17212b" text-anchor="start">07 Composite Structure Diagram</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#53616e" text-anchor="start">UML composite structure | logical internals of the Express inventory router</text><polyline points="42,116 1458,116" fill="none" stroke="#c9d0d7" stroke-width="1.7"/><rect x="270" y="165" width="1080" height="620" rx="0" stroke="#17212b" stroke-width="1.7" fill="#f4f6f8"/><text x="301" y="204.25" font-family="Arial" font-size="25" font-weight="bold" fill="#17212b" text-anchor="start">inventoryRouter : Express.Router</text><text x="301" y="235.5" font-family="Arial" font-size="25" font-weight="bold" fill="#17212b" text-anchor="start">structured classifier (logical view)</text><rect x="260" y="340" width="20" height="20" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><rect x="1340" y="595" width="20" height="20" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><rect x="42" y="307" width="178" height="90" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="131.0" y="347.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">HTTP client</text><text x="131.0" y="372.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">: Axios</text><rect x="340" y="302" width="300" height="140" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="490.0" y="352.75" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">access : Middleware</text><text x="490.0" y="380.25" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">authenticate()</text><text x="490.0" y="407.75" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">allowRoles()</text><rect x="890" y="302" width="335" height="140" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1057.5" y="352.75" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">handler : RouteHandler</text><text x="1057.5" y="380.25" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">run(action)</text><text x="1057.5" y="407.75" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">JSON / error response</text><rect x="340" y="567" width="300" height="140" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="490.0" y="617.75" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">service : StockService</text><text x="490.0" y="645.25" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">receiveStock()</text><text x="490.0" y="672.75" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">countStock()</text><rect x="890" y="567" width="335" height="140" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1057.5" y="618.625" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">models : SequelizeModels</text><text x="1057.5" y="644.875" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">StockItem, StockBatch</text><text x="1057.5" y="671.125" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">StockReceipt, StockMovement</text><polyline points="220,350 270,350 340,350" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="465.0" y="469.125" font-family="Arial" font-size="19" font-weight="normal" fill="#17212b" text-anchor="middle">request port: /api/inventory</text><polyline points="640,372 890,372" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="765.0" y="349.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">next()</text><polyline points="1055,442 1055,490 490,490 490,567" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="803.0" y="524.125" font-family="Arial" font-size="19" font-weight="normal" fill="#17212b" text-anchor="middle">invoke inventory service</text><polyline points="640,636 890,636" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="767.5" y="616.125" font-family="Arial" font-size="19" font-weight="normal" fill="#17212b" text-anchor="middle">model operations</text><polyline points="1225,605 1350,605 1430,605" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="1350.5" y="678.25" font-family="Arial" font-size="19" font-weight="normal" fill="#17212b" text-anchor="middle">SQL persistence</text><text x="1350.5" y="702.0" font-family="Arial" font-size="19" font-weight="normal" fill="#17212b" text-anchor="middle">port</text><text x="48" y="912.75" font-family="Arial" font-size="18" font-weight="normal" fill="#53616e" text-anchor="start">Small squares are ports; solid connectors link typed parts. This is a logical classifier view of existing code, not a new class.</text></svg>