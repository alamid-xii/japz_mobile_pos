<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950"><title>Deployment Diagram</title><desc>The deployment diagram maps the inventory artifacts to the local browser, Node.js runtime and MySQL service. The configured development ports are 5173 for Vite, 3000 for Express and 3306 for MySQL.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#17212b" text-anchor="start">04 Deployment Diagram</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#53616e" text-anchor="start">UML deployment | code-configured local development topology</text><polyline points="42,116 1458,116" fill="none" stroke="#c9d0d7" stroke-width="1.7"/><rect x="65" y="165" width="1370" height="620" rx="0" stroke="#17212b" stroke-width="1.7" fill="#f4f6f8"/><text x="94" y="205.375" font-family="Arial" font-size="25" font-weight="bold" fill="#17212b" text-anchor="start">«device» Developer workstation / local host</text><path d="M110,290 L134,270 H460 V645 L436,665 H110 Z M110,290 H436 L460,270 M436,290 V665" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="276.0" y="318.25" font-family="Arial" font-size="23" font-weight="bold" fill="#17212b" text-anchor="middle">«executionEnvironment»</text><text x="276.0" y="347.0" font-family="Arial" font-size="23" font-weight="bold" fill="#17212b" text-anchor="middle">Web browser</text><rect x="142" y="420" width="280" height="150" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="282.0" y="476.625" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">«artifact»</text><text x="282.0" y="502.875" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">Inventory UI</text><text x="282.0" y="529.125" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">React + TypeScript</text><path d="M575,290 L599,270 H925 V645 L901,665 H575 Z M575,290 H901 L925,270 M901,290 V665" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="741.0" y="317.75" font-family="Arial" font-size="22" font-weight="bold" fill="#17212b" text-anchor="middle">«executionEnvironment»</text><text x="741.0" y="345.25" font-family="Arial" font-size="22" font-weight="bold" fill="#17212b" text-anchor="middle">Node.js</text><text x="741.0" y="372.75" font-family="Arial" font-size="22" font-weight="bold" fill="#17212b" text-anchor="middle">Express :3000</text><rect x="610" y="427" width="272" height="145" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="746.0" y="481.125" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">«artifact»</text><text x="746.0" y="507.375" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">Backend inventory code</text><text x="746.0" y="533.625" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">Sequelize + mysql2</text><path d="M1035,290 L1059,270 H1385 V645 L1361,665 H1035 Z M1035,290 H1361 L1385,270 M1361,290 V665" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1202.5" y="323.25" font-family="Arial" font-size="23" font-weight="bold" fill="#17212b" text-anchor="middle">«executionEnvironment»</text><text x="1202.5" y="352.0" font-family="Arial" font-size="23" font-weight="bold" fill="#17212b" text-anchor="middle">MySQL :3306</text><rect x="1069" y="427" width="270" height="145" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1204.0" y="468.0" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">«artifact»</text><text x="1204.0" y="494.25" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">japz_pos schema</text><text x="1204.0" y="520.5" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">Inventory + shared</text><text x="1204.0" y="546.75" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">tables</text><polyline points="460,495 575,495" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="517.5" y="412.375" font-family="Arial" font-size="19" font-weight="normal" fill="#17212b" text-anchor="middle">HTTP</text><text x="517.5" y="436.125" font-family="Arial" font-size="19" font-weight="normal" fill="#17212b" text-anchor="middle">JSON</text><text x="517.5" y="459.875" font-family="Arial" font-size="19" font-weight="normal" fill="#17212b" text-anchor="middle">JWT</text><polyline points="925,495 1035,495" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="981.0" y="420.25" font-family="Arial" font-size="19" font-weight="normal" fill="#17212b" text-anchor="middle">MySQL</text><text x="981.0" y="444.0" font-family="Arial" font-size="19" font-weight="normal" fill="#17212b" text-anchor="middle">protocol</text><rect x="110" y="710" width="1275" height="56" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="747.5" y="745.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">Vite serves frontend source at :5173; production builds are static assets in japz-web/dist.</text><text x="48" y="912.75" font-family="Arial" font-size="18" font-weight="normal" fill="#53616e" text-anchor="start">Communication paths use solid lines. All environments are nested in one device because this view documents local development.</text></svg>