<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1190" viewBox="0 0 1500 1190"><title>Interaction Overview Diagram</title><desc>The interaction overview connects receiving authorization, the detailed stock transaction and inventory readback as referenced interactions. Decisions route denied access and failed transactions to their corresponding UI outcomes.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#17212b" text-anchor="start">15 Interaction Overview Diagram</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#53616e" text-anchor="start">UML interaction overview | receiving interaction and readback</text><polyline points="42,116 1458,116" fill="none" stroke="#c9d0d7" stroke-width="1.7"/><ellipse cx="730.0" cy="165.0" rx="12.0" ry="12.0" stroke="#17212b" stroke-width="1.7" fill="#17212b"/><rect x="480" y="215" width="500" height="125" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><polyline points="542,215 542,238 530,250 480,250" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="508.5" y="238.25" font-family="Arial" font-size="18" font-weight="bold" fill="#17212b" text-anchor="middle">ref</text><text x="730.0" y="287.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">Submit and authorize receiving</text><text x="730.0" y="312.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">UI → Inventory API → access middleware</text><polyline points="730,177 730,215" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M724.0,204.0 L730,215 L736.0,204.0" fill="none" stroke="#17212b" stroke-width="1.5"/><path d="M 730.0,400 L 815,455.0 L 730.0,510 L 645,455.0 Z" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="730.0" y="449.75" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">Access</text><text x="730.0" y="476.0" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">allowed?</text><polyline points="730,340 730,400" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M724.0,389.0 L730,400 L736.0,389.0" fill="none" stroke="#17212b" stroke-width="1.5"/><rect x="80" y="408" width="330" height="125" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><polyline points="142,408 142,431 130,443 80,443" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="108.5" y="431.25" font-family="Arial" font-size="18" font-weight="bold" fill="#17212b" text-anchor="middle">ref</text><text x="245.0" y="480.25" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">Show 401 / 403</text><text x="245.0" y="506.5" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">UI keeps form unchanged</text><polyline points="645,455 410,455" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M421.0,449.0 L410,455 L421.0,461.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="510.0" y="434.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">[no]</text><rect x="480" y="577" width="500" height="148" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><polyline points="542,577 542,600 530,612 480,612" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="508.5" y="600.25" font-family="Arial" font-size="18" font-weight="bold" fill="#17212b" text-anchor="middle">ref</text><text x="730.0" y="648.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">Receive stock transaction</text><text x="730.0" y="673.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">Identity check → conversion → stock writes</text><text x="730.0" y="698.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">See Sequence Diagram 12</text><polyline points="730,510 730,577" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M724.0,566.0 L730,577 L736.0,566.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="824.0" y="551.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">[yes]</text><path d="M 730.0,780 L 815,835.0 L 730.0,890 L 645,835.0 Z" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="730.0" y="830.5" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">Committed or</text><text x="730.0" y="853.0" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">replayed?</text><polyline points="730,725 730,780" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M724.0,769.0 L730,780 L736.0,769.0" fill="none" stroke="#17212b" stroke-width="1.5"/><rect x="1030" y="775" width="365" height="128" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><polyline points="1092,775 1092,798 1080,810 1030,810" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="1058.5" y="798.25" font-family="Arial" font-size="18" font-weight="bold" fill="#17212b" text-anchor="middle">ref</text><text x="1212.5" y="848.75" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">Rollback and return error</text><text x="1212.5" y="875.0" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">UI shows failed-save message</text><polyline points="815,835 1030,835" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M1019.0,841.0 L1030,835 L1019.0,829.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="916.5" y="813.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">[no]</text><rect x="480" y="960" width="500" height="105" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><polyline points="542,960 542,983 530,995 480,995" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="508.5" y="983.25" font-family="Arial" font-size="18" font-weight="bold" fill="#17212b" text-anchor="middle">ref</text><text x="730.0" y="1022.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">Refresh inventory data</text><text x="730.0" y="1047.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">GET stock / history → display balances</text><polyline points="730,890 730,960" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M724.0,949.0 L730,960 L736.0,949.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="824.0" y="932.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">[yes]</text><ellipse cx="730.0" cy="1123.0" rx="12.0" ry="12.0" stroke="#17212b" stroke-width="1.7" fill="white"/><ellipse cx="730.0" cy="1123.0" rx="7.0" ry="7.0" stroke="#17212b" stroke-width="1.7" fill="#17212b"/><polyline points="730,1065 730,1111" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M724.0,1100.0 L730,1111 L736.0,1100.0" fill="none" stroke="#17212b" stroke-width="1.5"/><polyline points="245,533 245,1123 718,1123" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M707.0,1129.0 L718,1123 L707.0,1117.0" fill="none" stroke="#17212b" stroke-width="1.5"/><polyline points="1210,903 1210,1123 742,1123" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M753.0,1117.0 L742,1123 L753.0,1129.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="48" y="1152.75" font-family="Arial" font-size="18" font-weight="normal" fill="#53616e" text-anchor="start">Framed ref nodes are interaction uses; diamonds and initial/final nodes control the overall interaction flow.</text></svg>