<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950"><title>Package Diagram</title><desc>The package diagram groups inventory source files by their actual frontend and backend directories. It shows the dependency path from inventory screens to the HTTP client, backend routes, services and models.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#17212b" text-anchor="start">06 Package Diagram</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#53616e" text-anchor="start">UML packages | actual code organization</text><polyline points="42,116 1458,116" fill="none" stroke="#c9d0d7" stroke-width="1.7"/><rect x="60" y="170" width="590" height="660" rx="0" stroke="#17212b" stroke-width="1.7" fill="#f4f6f8"/><text x="91" y="206.875" font-family="Arial" font-size="25" font-weight="bold" fill="#17212b" text-anchor="start">japz-web/src</text><path d="M95,294 V268 H370.0 V294 H595 V523 H95 Z M95,294 H370.0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="345.0" y="357.25" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">features/inventory</text><text x="345.0" y="384.75" font-family="Arial" font-size="22" font-weight="normal" fill=