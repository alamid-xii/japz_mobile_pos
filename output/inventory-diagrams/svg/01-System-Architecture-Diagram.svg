<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950"><title>System Architecture Diagram</title><desc>The inventory browser interface sends authenticated JSON requests to Express. Inventory services validate stock operations and persist related records through Sequelize in MySQL.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#17212b" text-anchor="start">01 System Architecture Diagram</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#53616e" text-anchor="start">Inventory module | verified three-layer architecture</text><polyline points="42,116 1458,116" fill="none" stroke="#c9d0d7" stroke-width="1.7"/><rect x="230" y="160" width="1040" height="165" rx="0" stroke="#17212b" stroke-width="1.7" fill="#f4f6f8"/><text x="750.0" y="192.875" font-family="Arial" font-size="21" font-weight="bold" fill="#17212b" text-anchor="middle">PRESENTATION LAYER</text><text x="750.0" y="239.875" font-family="Arial" font-size="25" font-weight="bold" fill="#17212b" text-anchor="middle">Inventory web interface | React + TypeScript + Vite</text><text x="750.0" y="292.875" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">Receiving, supplies, counts, recipes, prepared stock, history and reports</text><polyline points="750,325 750,407" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M744.0,396.0 L750,407 L756.0,396.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="960.0" y="367.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">HTTP / JSON + Bearer JWT</text><rect x="230" y="407" width="1040" height="260" rx="0" stroke="#17212b" stroke-width="1.7" fill="#f4f6f8"/><text x="750.0" y="444.75" font-family="Arial" font-size="23" font-weight="bold" fill="#17212b" text-anchor="middle">APPLICATION LAYER | Node.js + Express</text><text x="750.0" y="473.5" font-family="Arial" font-size="23" font-weight="bold" fill="#17212b" text-anchor="middle">/api/inventory</text><rect x="270" y="510" width="260" height="100" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="400.0" y="554.75" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">Authentication</text><text x="400.0" y="581.0" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">and role access</text><rect x="620" y="510" width="260" height="100" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="750.0" y="554.75" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">Stock services</text><text x="750.0" y="581.0" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">and validation</text><rect x="970" y="510" width="260" height="100" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1100.0" y="554.75" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">Sequelize models</text><text x="1100.0" y="581.0" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">and transactions</text><polyline points="530,560 620,560" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M609.0,566.0 L620,560 L609.0,554.0" fill="none" stroke="#17212b" stroke-width="1.5"/><polyline points="880,560 970,560" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M959.0,566.0 L970,560 L959.0,554.0" fill="none" stroke="#17212b" stroke-width="1.5"/><polyline points="750,667 750,746" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M744.0,735.0 L750,746 L756.0,735.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="902.5" y="708.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">SQL / mysql2</text><path d="M230,768 C230,739 1270,739 1270,768 V846 C1270,875 230,875 230,846 Z M230,768 C230,797 1270,797 1270,768" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="750.0" y="815.75" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">DATA LAYER | MySQL: japz_pos</text><text x="750.0" y="844.5" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">Inventory tables + shared Users, menu_items and Orders</text><text x="48" y="912.75" font-family="Arial" font-size="18" font-weight="normal" fill="#53616e" text-anchor="start">Inventory Staff and Admin use the inventory interface; Cashier and Kitchen interact only at inventory boundaries.</text></svg>