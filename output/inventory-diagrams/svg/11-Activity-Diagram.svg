<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1160" viewBox="0 0 1500 1160"><title>Activity Diagram</title><desc>The activity diagram shows a stock receipt from submission through access checks, request identity handling, unit conversion and transactional persistence. Identical retries return the saved result; failed operations roll back.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#17212b" text-anchor="start">11 Activity Diagram</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#53616e" text-anchor="start">UML activity | atomic stock receiving with safe retries</text><polyline points="42,116 1458,116" fill="none" stroke="#c9d0d7" stroke-width="1.7"/><ellipse cx="730.0" cy="165.0" rx="12.0" ry="12.0" stroke="#17212b" stroke-width="1.7" fill="#17212b"/><rect x="510" y="210" width="440" height="72" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="730.0" y="253.875" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">Enter delivery and submit requestId</text><polyline points="730,177 730,210" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M724.0,199.0 L730,210 L736.0,199.0" fill="none" stroke="#17212b" stroke-width="1.5"/><rect x="510" y="326" width="440" height="72" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="730.0" y="369.875" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">Authenticate and authorize actor</text><polyline points="730,282 730,326" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M724.0,315.0 L730,326 L736.0,315.0" fill="none" stroke="#17212b" stroke-width="1.5"/><rect x="510" y="442" width="440" height="72" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="730.0" y="485.5" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">Begin transaction; check request identity</text><polyline points="730,398 730,442" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M724.0,431.0 L730,442 L736.0,431.0" fill="none" stroke="#17212b" stroke-width="1.5"/><path d="M 730.0,555 L 820,605.0 L 730.0,655 L 640,605.0 Z" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="730.0" y="600.25" font-family="Arial" font-size="19" font-weight="normal" fill="#17212b" text-anchor="middle">Existing</text><text x="730.0" y="624.0" font-family="Arial" font-size="19" font-weight="normal" fill="#17212b" text-anchor="middle">request?</text><polyline points="730,514 730,555" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M724.0,544.0 L730,555 L736.0,544.0" fill="none" stroke="#17212b" stroke-width="1.5"/><rect x="1000" y="550" width="380" height="110" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1190.0" y="588.375" font-family="Arial" font-size="19" font-weight="normal" fill="#17212b" text-anchor="middle">Same actor, kind and fingerprint?</text><text x="1190.0" y="612.125" font-family="Arial" font-size="19" font-weight="normal" fill="#17212b" text-anchor="middle">Return saved result if identical;</text><text x="1190.0" y="635.875" font-family="Arial" font-size="19" font-weight="normal" fill="#17212b" text-anchor="middle">otherwise reject with conflict.</text><polyline points="820,605 1000,605" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M989.0,611.0 L1000,605 L989.0,599.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="903.5" y="586.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">[yes]</text><rect x="510" y="703" width="440" height="92" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="730.0" y="744.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">Create operation; lock stock items;</text><text x="730.0" y="769.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">validate supplier, date and delivery lines</text><polyline points="730,655 730,703" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M724.0,692.0 L730,703 L736.0,692.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="795.0" y="679.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">[no]</text><rect x="510" y="843" width="440" height="92" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="730.0" y="884.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">Convert units; create receipt / batches;</text><text x="730.0" y="909.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">update balances; append movements / lines</text><polyline points="730,795 730,843" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M724.0,832.0 L730,843 L736.0,832.0" fill="none" stroke="#17212b" stroke-width="1.5"/><rect x="510" y="973" width="440" height="72" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="730.0" y="1016.875" font-family="Arial" font-size="21" font-weight="normal" fill="#17212b" text-anchor="middle">Save result; commit; refresh stock</text><polyline points="730,935 730,973" fill=