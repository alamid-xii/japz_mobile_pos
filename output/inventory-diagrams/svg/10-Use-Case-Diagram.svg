<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1130" viewBox="0 0 1500 1130"><title>Use Case Diagram</title><desc>This use case diagram shows the inventory goals available to Inventory Staff and Admin, including the Admin-only count review, reversal and policy controls. Cashier and Kitchen actors appear only for relevant read access and Kitchen waste reporting.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#17212b" text-anchor="start">10 Use Case Diagram</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#53616e" text-anchor="start">UML use cases | actual permissions of inventory and boundary actors</text><polyline points="42,116 1458,116" fill="none" stroke="#c9d0d7" stroke-width="1.7"/><rect x="285" y="155" width="930" height="850" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="750.0" y="203.375" font-family="Arial" font-size="25" font-weight="bold" fill="#17212b" text-anchor="middle">Inventory Management</text><ellipse cx="170.0" cy="487.0" rx="17.0" ry="17.0" stroke="#17212b" stroke-width="1.7" fill="white"/><polyline points="170,504 170,564" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="130,523 210,523" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="170,564 137,604" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="170,564 203,604" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="170.5" y="633.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">Inventory Staff</text><text x="170.5" y="658.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">role: inventory</text><ellipse cx="735.0" cy="276.0" rx="275.0" ry="36.0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="735.0" y="284.25" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">View stock and availability</text><polyline points="214,560 330,560 330,276 460,276" fill="none" stroke="#17212b" stroke-width="1.7"/><ellipse cx="735.0" cy="386.0" rx="275.0" ry="36.0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="735.0" y="394.25" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">Maintain supplies and suppliers</text><polyline points="214,560 330,560 330,386 460,386" fill="none" stroke="#17212b" stroke-width="1.7"/><ellipse cx="735.0" cy="496.0" rx="275.0" ry="36.0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="735.0" y="504.25" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">Receive stock / prepared stock</text><polyline points="214,560 330,560 330,496 460,496" fill="none" stroke="#17212b" stroke-width="1.7"/><ellipse cx="735.0" cy="606.0" rx="275.0" ry="36.0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="735.0" y="614.25" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">Manage recipes and batches</text><polyline points="214,560 330,560 330,606 460,606" fill="none" stroke="#17212b" stroke-width="1.7"/><ellipse cx="735.0" cy="716.0" rx="275.0" ry="36.0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="735.0" y="724.25" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">Record counts, waste and returns</text><polyline points="214,560 330,560 330,716 460,716" fill="none" stroke="#17212b" stroke-width="1.7"/><ellipse cx="735.0" cy="826.0" rx="275.0" ry="36.0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="735.0" y="834.25" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">Review waste reports</text><polyline points="214,560 330,560 330,826 460,826" fill="none" stroke="#17212b" stroke-width="1.7"/><ellipse cx="735.0" cy="936.0" rx="275.0" ry="36.0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="735.0" y="944.25" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">View history, reports and settings</text><polyline points="214,560 330,560 330,936 460,936" fill="none" stroke="#17212b" stroke-width="1.7"/><ellipse cx="1305.0" cy="447.0" rx="17.0" ry="17.0" stroke="#17212b" stroke-width="1.7" fill="white"/><polyline points="1305,464 1305,524" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="1265,483 1345,483" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="1305,524 1272,564" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="1305,524 1338,564" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="1305.5" y="593.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">Admin</text><text x="1305.5" y="618.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">role: admin</text><polyline points="1305,430 1305,227 170,227 170,470" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M164.0,455.0 L170,470 L176.0,455.0 Z" fill="white" stroke="#17212b" stroke-width="1.5"/><ellipse cx="1105.0" cy="677.5" rx="80.0" ry="37.5" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1105.0" y="684.25" font-fam