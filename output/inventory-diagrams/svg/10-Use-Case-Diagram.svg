"1305,974 1338,1014" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="1305.5" y="1043.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">Kitchen Staff</text><text x="1305.5" y="1068.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">role: kitchen</text><ellipse cx="1105.0" cy="925.0" rx="80.0" ry="48.0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1105.0" y="909.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">Submit / view</text><text x="1105.0" y="931.75" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">own waste</text><text x="1105.0" y="954.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">reports</text><polyline points="1260,940 1185,925" fill="none" stroke="#17212b" stroke-width="1.7"/><polyline points="1260,916 1225,916 1225,276 1010,276" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="48" y="1092.75" font-family="Arial" font-size="18" font-weight="normal" fill="#53616e" text-anchor="start">Actor generalization points from Admin to Inventory Staff capability. Kitchen/Cashier have API read access; inventory screens require Inventory/Admin.</text></svg>