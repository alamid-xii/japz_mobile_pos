 stock / recipe services</text><text x="275.0" y="1019.5" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">supplyMovement + saveRecipe</text><line x1="485.0" y1="1000.0" x2="492.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="497.0" y1="1000.0" x2="504.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="509.0" y1="1000.0" x2="516.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="521.0" y1="1000.0" x2="528.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="533.0" y1="1000.0" x2="540.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="545.0" y1="1000.0" x2="552.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="557.0" y1="1000.0" x2="564.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="569.0" y1="1000.0" x2="576.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="581.0" y1="1000.0" x2="588.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="593.0" y1="1000.0" x2="600.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="605.0" y1="1000.0" x2="612.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="617.0" y1="1000.0" x2="624.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="629.0" y1="1000.0" x2="636.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="641.0" y1="1000.0" x2="648.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="653.0" y1="1000.0" x2="660.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="665.0" y1="1000.0" x2="672.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><line x1="677.0" y1="1000.0" x2="680.0" y2="1000.0" stroke="#17212b" stroke-width="1.7"/><path d="M669.0,1006.0 L680,1000 L669.0,994.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="578.0" y="971.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">«satisfy»</text><text x="48" y="1172.75" font-family="Arial" font-size="18" font-weight=