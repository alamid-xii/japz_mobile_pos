<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1210" viewBox="0 0 1500 1210"><title>Requirement Diagram (SysML)</title><desc>The requirement diagram expresses five concrete inventory rules supported by the implementation and links each rule to the code element that satisfies it. SysML requirement blocks carry an ID and requirement text; satisfy arrows point to the requirement.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#17212b" text-anchor="start">17 Requirement Diagram (SysML)</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#53616e" text-anchor="start">SysML requirements | implementation-derived rules and satisfying elements</text><polyline points="42,116 1458,116" fill="none" stroke="#c9d0d7" stroke-width="1.7"/><rect x="680" y="165" width="735" height="145" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1047.5" y="199.25" font-family="Arial" font-size="22" font-weight="bold" fill="#17212b" text-anchor="middle">«requirement» Authorized inventory changes</text><polyline points="680,215 1415,215" fill="none" stroke="#17212b" stroke-width="1.7"/><text x="701" y="257.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">id = INV-01</text><text x="701" y="282.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="start">text = Only approved Inventory/Admin may write stock.</text><rect x="65" y="180" width="420" height="115" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="275.0" y="232.0" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">«block» access middleware</text><text x="275.0" y="259.5" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">authenticate + allowRoles</text><line x1="485.0" y1="240.0" x2="492.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="497.0" y1="240.0" x2="504.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="509.0" y1="240.0" x2="516.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="521.0" y1="240.0" x2="528.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="533.0" y1="240.0" x2="540.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="545.0" y1="240.0" x2="552.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="557.0" y1="240.0" x2="564.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="569.0" y1="240.0" x2="576.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="581.0" y1="240.0" x2="588.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="593.0" y1="240.0" x2="600.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="605.0" y1="240.0" x2="612.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="617.0" y1="240.0" x2="624.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="629.0" y1="240.0" x2="636.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="641.0" y1="240.0" x2="648.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="653.0" y1="240.0" x2="660.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="665.0" y1="240.0" x2="672.0" y2="240.0" stroke="#17212b" stroke-width="1.7"/><line x1="677.0" y1="