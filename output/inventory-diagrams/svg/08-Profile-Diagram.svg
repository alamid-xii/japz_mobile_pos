<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950"><title>Profile Diagram</title><desc>This profile defines three inventory-specific UML stereotypes for records, service components and stock operations. Each stereotype extends the appropriate UML metaclass and supplies concise documentation tags.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#17212b" text-anchor="start">08 Profile Diagram</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#53616e" text-anchor="start">UML profile | explicit modeling convention for this documentation</text><polyline points="42,116 1458,116" fill="none" stroke="#c9d0d7" stroke-width="1.7"/><path d="M60,186 V160 H819.0000000000001 V186 H1440 V820 H60 Z M60,186 H819.0000000000001" stroke="#17212b" stroke-width="1.7" fill="#f4f6f8"/><text x="96" y="229.125" font-family="Arial" font-size="27" font-weight="bold" fill="#17212b" text-anchor="start">«profile» JAPZInventoryProfile</text><rect x="135" y="280" width="520" height="126" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="395.0" y="322.875" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">«stereotype» InventoryRecord</text><text x="395.0" y="351.625" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">tableName: String</text><text x="395.0" y="380.375" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">Example: StockBatch</text><rect x="1020" y="280" width="320" height="126" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1180.0" y="337.0" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">«metaclass»</text><text x="1180.0" y="367.0" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">Class</text><polyline points="655,343 1020,343" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M1009.0,349.0 L1020,343 L1009.0,337.0 Z" fill="#17212b" stroke="#17212b" stroke-width="1.5"/><text x="840.0" y="321.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">extension</text><rect x="135" y="470" width="520" height="126" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="395.0" y="512.875" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">«stereotype» InventoryService</text><text x="395.0" y="541.625" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">sourceFile: String</text><text x="395.0" y="570.375" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">Example: inventoryService.js</text><rect x="1020" y="470" width="320" height="126" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1180.0" y="527.0" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">«metaclass»</text><text x="1180.0" y="557.0" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">Component</text><polyline points="655,533 1020,533" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M1009.0,539.0 L1020,533 L1009.0,527.0 Z" fill="#17212b" stroke="#17212b" stroke-width="1.5"/><text x="840.0" y="511.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">extension</text><rect x="135" y="660" width="520" height="126" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="395.0" y="702.875" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">«stereotype» StockOperation</text><text x="395.0" y="731.625" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">transactional: Boolean</text><text x="395.0" y="760.375" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">Example: receiveStock()</text><rect x="1020" y="660" width="320" height="126" rx="0" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1180.0" y="717.0" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">«metaclass»</text><text x="1180.0" y="747.0" font-family="Arial" font-size="24" font-weight="normal" fill="#17212b" text-anchor="middle">Operation</text><polyline points="655,723 1020,723" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M1009.0,729.0 L1020,723 L1009.0,717.0 Z" fill="#17212b" stroke="#17212b" stroke-width="1.5"/><text x="840.0" y="701.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">extension</text><text x="48" y="912.75" font-family="Arial" font-size="18" font-weight="normal" fill="#53616e" text-anchor="start">Extension arrows point to UML metaclasses. Tags annotate the model; stereotypes do not create application code or tables.</text></svg>