<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050"><title>State Machine Diagram</title><desc>The state machine models the four implemented StockCount status values. A valid count is immediately applied or placed in pending review; Admin review applies, rejects or marks it stale if the balance version or reserved quantity makes it unsafe.</desc><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#17212b" stroke-width="1.4"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="extension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#17212b"/></marker><marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#17212b" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55.25" font-family="Arial" font-size="30" font-weight="bold" fill="#17212b" text-anchor="start">13 State Machine Diagram</text><text x="48" y="98.0" font-family="Arial" font-size="20" font-weight="normal" fill="#53616e" text-anchor="start">UML state machine | StockCount.status lifecycle</text><polyline points="42,116 1458,116" fill="none" stroke="#c9d0d7" stroke-width="1.7"/><ellipse cx="110.0" cy="250.0" rx="12.0" ry="12.0" stroke="#17212b" stroke-width="1.7" fill="#17212b"/><path d="M 375.0,190 L 485,250.0 L 375.0,310 L 265,250.0 Z" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="375.0" y="244.5" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">Approval</text><text x="375.0" y="272.0" font-family="Arial" font-size="22" font-weight="normal" fill="#17212b" text-anchor="middle">required?</text><polyline points="122,250 265,250" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M254.0,256.0 L265,250 L254.0,244.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="183.0" y="221.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">valid count</text><rect x="625" y="190" width="270" height="120" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="760.0" y="244.25" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">pending</text><text x="760.0" y="273.0" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">Balance unchanged</text><rect x="1110" y="495" width="290" height="120" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="1255.0" y="549.25" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">applied</text><text x="1255.0" y="578.0" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">Count movement saved</text><polyline points="485,250 625,250" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M614.0,256.0 L625,250 L614.0,244.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="552.5" y="229.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">[yes]</text><polyline points="375,190 375,145 1450,145 1450,550 1400,550" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M1411.0,544.0 L1400,550 L1411.0,556.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="1205.0" y="383.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">[no] / apply count immediately</text><path d="M 760.0,495 L 855,550.0 L 760.0,605 L 665,550.0 Z" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="760.0" y="545.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">Approval</text><text x="760.0" y="570.0" font-family="Arial" font-size="20" font-weight="normal" fill="#17212b" text-anchor="middle">still valid?</text><polyline points="760,310 760,495" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M754.0,484.0 L760,495 L766.0,484.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="883.0" y="400.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">Admin approves</text><polyline points="855,550 1110,550" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M1099.0,556.0 L1110,550 L1099.0,544.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="1147.0" y="665.0" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">[version matches and count ≥ reserved]</text><text x="1147.0" y="687.5" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">/ apply count movement</text><rect x="620" y="772" width="280" height="115" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="760.0" y="823.75" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">stale</text><text x="760.0" y="852.5" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">New count required</text><polyline points="760,605 760,772" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M754.0,761.0 L760,772 L766.0,761.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="1092.5" y="693.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">[version changed or count &lt; reserved]</text><rect x="100" y="495" width="295" height="115" rx="12" stroke="#17212b" stroke-width="1.7" fill="white"/><text x="247.5" y="546.75" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">rejected</text><text x="247.5" y="575.5" font-family="Arial" font-size="23" font-weight="normal" fill="#17212b" text-anchor="middle">Balance unchanged</text><polyline points="625,250 520,250 520,550 395,550" fill="none" stroke="#17212b" stroke-width="1.7"/><path d="M406.0,544.0 L395,550 L406.0,556.0" fill="none" stroke="#17212b" stroke-width="1.5"/><text x="240.0" y="409.25" font-family="Arial" font-size="18" font-weight="normal" fill="#17212b" text-anchor="middle">Admin rejects</text><text x="48" y="1012.75" font-family="Arial" font-size="18" font-weight="normal" fill="#53616e" text-anchor="start">Invalid submission is rejected before a StockCount is created. applied, rejected and stale have no further status transitions in this API.</text></svg>