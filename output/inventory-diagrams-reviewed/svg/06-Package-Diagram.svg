<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1030" viewBox="0 0 900 1030"><title>Package Diagram</title><desc>Figure 6 organizes the implementation by its real source responsibilities. The features/inventory package contains screens, shared controls, InventoryData and data helpers. Client support represents the shared hooks, protected-route component, request-ID utility and Axios transport. Its connection to backend routes represents an HTTP contract rather than a JavaScript import across the browser/server boundary.

The backend routes use access middleware and domain services. Middleware reads User records, while Inventory services use stock and directly shared models through the models package. models/index.js registers associations and db.js supplies the Sequelize connection. MySQL is an external persistence service, not a source-code package. These package dependencies describe code organization without asserting separate deployment units.</desc><rect width="100%" height="100%" fill="white"/>
