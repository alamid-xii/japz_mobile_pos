<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050"><title>Data Flow Diagram (DFD)</title><desc>Figure 9 is a Level 1 data-flow view. Inventory Staff and Admin supply master details, receiving entries, counts, losses and review decisions. The first two processes maintain reference/policy data and stock transactions. Their outputs update balances, receipt/batch/count/waste records and movement history. Named arrows represent information transferred, rather than control flow or the chronological order of API calls.

The direct Cashier/Kitchen boundary provides order and status data for allocation, reservation, consumption and release; Kitchen waste reports enter the receiving/loss process. The reporting process reads master data, batches, allocations and movements to produce balances, availability and report data. CSV files are assembled in the frontend. The stores group related implemented tables for readability and do not assert a new physical database design.</desc><rect width="100%" height="100%" fill="white"/>
