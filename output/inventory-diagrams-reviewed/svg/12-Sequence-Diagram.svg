<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1170" viewBox="0 0 900 1170"><title>Sequence Diagram</title><desc>Figure 12 places receiving messages in implementation order. Receiving.tsx submits delivery lines and a requestId. Middleware verifies the approved user's role before receiveStock enters inventoryOperation. The service validates the request identity, computes a payload fingerprint and starts a transaction. Its locked InventoryOperation lookup distinguishes a matching saved request from a new operation or a conflicting reuse of the identifier.

For a new request, the service creates the operation, locks supplies and creates one receipt. The loop validates and converts each line, creates its batch and movement, updates balances and creates the receipt line. The operation result is saved before commit. Matching retries return the original result; invalid input, mismatched identity or failed writes return an error and roll back. Only a successful response leads the interface to refresh stock and receipt history.</desc><rect width="100%" height="100%" fill="white"/>
