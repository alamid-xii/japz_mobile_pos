<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850"><title>Timing Diagram</title><desc>Figure 16 shows an illustrative participant activity timing view: high means active and low means idle. Staff submission, UI transmission, access checks, stock processing and database work are placed in their causal order. Protected stock processing begins after authorization, and the UI displays the saved result after the persistence phase completes.

The zero-to-four-second axis is an illustrative teaching scale, not a measured response time, timeout, benchmark or performance requirement. Database activity includes the transaction and locking needed for receiving, while the service handles validation and related writes. The figure is a simplified successful interaction; duplicate-request, conflict and rollback alternatives are specified in Figure 12 rather than assigned invented durations here.</desc><rect width="100%" height="100%" fill="white"/>
