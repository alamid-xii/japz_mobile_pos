<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000"><title>Component Diagram</title><desc>Figure 3 separates the Inventory web component, API routing, access middleware, domain services and Sequelize persistence. Dependency arrows point toward the component used. The frontend reaches backend functions through the JSON API; it does not bypass routing by calling an authorization component or the database directly. Authentication is enforced on the server as well as through the frontend route guard.

The domain service group contains the existing stock, recipe/availability, settings and order-inventory modules. Access middleware depends on the shared User model, while domain services depend on Inventory and directly shared persistence models. The web component performs CSV formatting, refresh scheduling and alert display. These are logical components of the implemented application, not separately deployed servers or newly introduced interfaces.</desc><rect width="100%" height="100%" fill="white"/>
