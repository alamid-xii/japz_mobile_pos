<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120"><title>Activity Diagram</title><desc>Figure 11 models the main choice between stock-changing work and read-only reports. Approved-user and role checks precede protected actions. On the stock path, receiving, count, waste and return inputs are validated against quantity, version and reservation rules. Related writes commit together, or a physical count is recorded as pending when policy requires Admin review; queuing that count leaves its balance unchanged.

Invalid input or a failed transactional write produces an error and rolls back pending changes. The user can correct the input and retry with the form's request identity. The report branch retrieves filtered data and may generate a browser CSV download. A merge node reunites successful branches before refreshing or leaving the workspace; denied access terminates the attempt without entering stock processing.</desc><rect width="100%" height="100%" fill="white"/>
