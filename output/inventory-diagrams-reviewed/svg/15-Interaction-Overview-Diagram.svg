<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1030" viewBox="0 0 900 1030"><title>Interaction Overview Diagram</title><desc>Figure 15 coordinates the smaller receiving interactions using frames labeled ref and guarded activity decisions. Authorization is followed by an access decision. An authorized attempt invokes the receiving interaction expanded in Figure 12. A saved result, including a valid idempotent retry, is followed by retrieval of current stock and receipt history.

Denied access ends the attempt. A receiving error is displayed for correction or retry, and does not enter the successful-refresh path. The overview keeps activity decisions separate from the detailed message sequence and transaction logic. Each referenced interaction corresponds to existing authentication, receiving or refresh behavior; the frames do not imply a new workflow engine.</desc><rect width="100%" height="100%" fill="white"/>
