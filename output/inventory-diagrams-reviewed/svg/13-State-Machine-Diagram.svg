<text font-family="Calibri,Arial,sans-serif" font-size="21" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="715" y="272.5">[approval not required] / apply</tspan></text>
<text font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="620" y="459.5">approve (Admin)</tspan></text>
<text font-family="Calibri,Arial,sans-serif" font-size="21" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="450" y="861.4">Only valid submissions create a count. Initial version/reservation failures</tspan><tspan x="450" y="886.6">return an error; only a pending count can become stale during Admin approval.</tspan></text>
