<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 900 920"><title>State Machine Diagram</title><desc>Figure 13 models the implemented StockCount states pending, applied, rejected and stale. A valid submission is created as applied when review is unnecessary, or pending when the Inventory user's discrepancy requires approval. Admin submissions bypass the approval queue. A pending count preserves the current balance until an Admin review decision is made.

Rejecting a pending count records rejected without changing stock. Approving it first checks the item's expected version and whether the counted quantity still covers reservations. A conflict records stale and requires a new count; otherwise the service applies the difference and records applied. Initial submission failures return an error before a count exists and must not be drawn as a newly created stale record. Re-reviewing a completed count does not apply the change again.</desc><rect width="100%" height="100%" fill="white"/>
