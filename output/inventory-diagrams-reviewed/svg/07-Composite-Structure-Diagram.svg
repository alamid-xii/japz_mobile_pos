<svg xmlns="http://www.w3.org/2000/svg" width="900" height="750" viewBox="0 0 900 750"><title>Composite Structure Diagram</title><desc>Figure 7 models the internal stock-receiving collaboration within the Inventory API. The HTTP port delegates a request through authentication and role checks to the protected Inventory handler. The stock-service part collaborates with model access, and the persistence port marks the database boundary. The connectors describe cooperation inside one API boundary.

The named parts are a documentation-level view of access.js, routes/inventory.js, inventoryService.js and Sequelize model access. They do not introduce a new InventoryAPI class or claim that the JavaScript modules are constructed as runtime objects. This figure is scoped to the stock-receiving path; other availability, settings and order-allocation collaborations are shown in the architecture and component views.</desc><rect width="100%" height="100%" fill="white"/>
