<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000"><title>Communication Diagram</title><desc>Figure 14 shows the receiving collaboration as a communication diagram with numbered messages. Staff submit delivery data to the receiving interface, which posts to the Inventory router. The access-middleware participant verifies JWT identity, approved status and permitted role before the protected handler calls receiveStock. The middleware check must complete successfully before the protected service performs stock writes.

The service coordinates the transaction, operation-identity lookup, repeated line writes, stored result and commit through Sequelize/MySQL. The asterisk denotes repetition for each delivery line. Replies follow the same collaboration links back to the UI. Participant names are documentation roles for implemented modules and records, not newly added runtime classes. Figure 12 contains the more detailed replay and rollback alternatives.</desc><rect width="100%" height="100%" fill="white"/>
