<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120"><title>Use Case Diagram</title><desc>Figure 10 shows the Inventory Staff use cases and the direct Admin boundary. Staff can view records, maintain supplies/suppliers, receive stock, manage recipes/batch holds, record counts/losses, review Kitchen waste and edit alert/refresh settings. Admin can perform these Inventory functions and also approve physical counts, reverse movements and control count-approval/reorder policies. These additional permissions are not granted to Inventory Staff.

Kitchen waste submission and Cashier/Kitchen availability access are documented as direct interactions rather than complete additional modules. Receiving necessarily validates and converts delivery quantities, and CSV export is optional when viewing reports. The diagram avoids treating the act of queuing a count for review as permission for Staff to perform Admin approval. Actor associations describe goals, not a required sequence of screens.</desc><rect width="100%" height="100%" fill="white"/>
