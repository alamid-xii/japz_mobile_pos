<text font-family="Calibri,Arial,sans-serif" font-size="21" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="55" y="110.8">id: Integer</tspan><tspan x="55" y="136">name: String</tspan><tspan x="55" y="161.2">active: Boolean</tspan></text>
