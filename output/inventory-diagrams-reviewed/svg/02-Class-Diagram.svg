<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><title>Class Diagram</title><desc>Figure 2 illustrates the core Inventory record classes and their associations. Supplier can be associated with many StockItem and StockReceipt records; the supplier reference is optional. Each StockBatch belongs to one StockItem. A successfully recorded receipt contains one to 100 lines, and every StockReceiptLine identifies one receipt, one stock item and one batch. Its conversion and quantity fields retain the purchased and base-unit amounts.

StockMovement records an action, quantity, reason and on-hand/reserved deltas. Its stock-item and batch references are optional because prepared-stock movements use the shared MenuItem instead. The diagram shows associations rather than unsupported lifecycle composition. Its receipt-line minimum describes the receiving workflow, not a separate SQL minimum-cardinality constraint. Counts, waste reports, recipes, allocations, settings and operation identity records are named as supporting models; they are not fictitious classes or methods.</desc><rect width="100%" height="100%" fill="white"/>
