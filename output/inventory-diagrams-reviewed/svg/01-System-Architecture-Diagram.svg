<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130"><title>System Architecture Diagram</title><desc>Figure 1 presents the Inventory module architecture verified from the supplied GitDiagram model and the implementation. App.tsx and InventoryLayout organize the Inventory routes inside the browser. Login and useAuth provide shared sign-in state, while ProtectedRoute checks frontend access. Inventory screens use InventoryData.tsx and data.ts for shared records and refresh helpers, then call the Axios client in api.ts. CSV downloads, visible stock alerts and refresh timers are browser responsibilities.

The Express runtime mounts shared routes and /api/inventory. Server middleware verifies the JWT, reloads an approved User and enforces the requested role. Stock, availability, settings and order-inventory services use Sequelize models and transactions to access MySQL. Cashier order creation and Kitchen status/waste requests are direct module boundaries, not independent services added to Inventory. Shared user, menu, order and payment records remain necessary because the original system is a modular monolith.</desc><rect width="100%" height="100%" fill="white"/>
