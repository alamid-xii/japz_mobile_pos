<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1110" viewBox="0 0 900 1110"><title>Requirement Diagram (SysML)</title><desc>Figure 17 derives five requirements from Inventory's overall purpose and expresses each with an Id and Text property. They cover direct-write access control, atomic/idempotent receiving, safe availability and reservation handling, versioned count approval, and traceable movement history. The access wording distinguishes direct Inventory/Admin adjustments from stock changes legitimately initiated through Cashier/Kitchen order transitions.

The deriveReqt dependencies point toward the overall requirement, while satisfy dependencies point from named implementation artifacts to the rule they implement. These artifacts are the existing middleware, routes, domain services and model definitions. The requirements are reconstructed from code behavior for academic traceability, not evidence of a separately approved product specification. Source and existing-test mappings are provided in the review notes; the diagram does not claim a new test run or production acceptance.</desc><rect width="100%" height="100%" fill="white"/>
