<svg xmlns="http://www.w3.org/2000/svg" width="900" height="990" viewBox="0 0 900 990"><title>Profile Diagram</title><desc>Figure 8 defines an Inventory-specific UML documentation profile. InventoryRecord extends the Class metaclass, StockService extends Component, and StockOperation extends Operation. Each extension uses a solid line with a filled triangle directed at the UML metaclass. The BaseUnit and StockAction enumerations type stereotype properties; they are not targets of metaclass extensions.

The base-unit values match g, ml and pcs. StockAction now includes the movement actions defined by the model, including opening, reversal, hold and unhold. The constraints summarize non-negative balances, reservation protection and append-only history enforced by service logic. JAPZInventoryProfile is an illustrative modeling convention for this documentation, not an implemented profile engine or an additional application feature.</desc><rect width="100%" height="100%" fill="white"/>
