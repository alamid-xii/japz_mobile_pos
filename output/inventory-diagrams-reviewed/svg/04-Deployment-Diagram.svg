<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 900 1040"><title>Deployment Diagram</title><desc>Figure 4 shows the configured local deployment and its separate frontend and backend communication paths. The browser obtains React assets from Vite on port 5173 and sends Inventory HTTP/JSON calls to the Express API on port 3000. These are separate connections even when all execution environments are on one physical workstation. Vite serves and updates the frontend; Express performs protected backend operations.

Only the backend accesses MySQL through Sequelize and the MySQL driver. Port 3306 and the japz_pos schema describe the main project's local configuration. The separate GitDiagram repository is an extraction with its own configurable database name; that does not change the main system's deployment. No live cloud topology, production host, load balancer or backup service is implied by this diagram.</desc><rect width="100%" height="100%" fill="white"/>
